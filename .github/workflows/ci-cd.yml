name: LeadGuard OS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-test:
    name: 🧪 Continuous Integration (Typecheck & Audit Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadguard
          POSTGRES_PASSWORD: leadguard_ci
          POSTGRES_DB: leadguardos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://leadguard:leadguard_ci@localhost:5432/leadguardos_ci

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🗄️ Apply Database Migrations
        run: npx prisma migrate deploy

      - name: 🔍 TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: 🧪 Run Automated 4-Pillar Diagnostic Test Suite
        run: npx tsx tests/run-tests.ts

      - name: 🐘 Run PostgreSQL Integration Tests
        run: npm run test:pg

      - name: 🏗️ Production Build Bundle Check
        run: npm run build

      - name: 🔐 Dependency Audit
        run: npm audit --audit-level=high || true

  docker-build:
    name: 🐳 Container Build & Deployment Check
    needs: quality-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: leadguardos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
