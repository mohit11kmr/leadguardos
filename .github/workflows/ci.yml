name: CI Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadguard
          POSTGRES_PASSWORD: leadguard_ci
          POSTGRES_DB: leadguardos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://leadguard:leadguard_ci@localhost:5432/leadguardos_ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations
        run: npx prisma migrate deploy

      - name: Run Linter & Typecheck
        run: npm run lint

      - name: Run Unit Test Suite
        run: npm test

      - name: Run PostgreSQL Integration Tests
        run: npm run test:pg

      - name: Production Build Verification
        run: npm run build

      - name: Dependency Audit
        run: npm audit --audit-level=high || true

      - name: Docker Build Verification
        run: docker build --tag leadguardos:ci .
